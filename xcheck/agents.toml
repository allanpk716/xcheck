# xcheck agent registry — how to call each local AI agent CLI non-interactively.
# Values locked by Task 1 CLI smokes (see docs/cli-findings.md).
# To add a new agent you installed: add an [agents.<name>] block below and run
#   /xcheck-setup   (or just re-run lib/detect.sh to confirm detection).
#
# 超时配置: xcheck 调用 agent 时给的总执行时限。注意: 这个值由搬运工通过
# 「后台启动 + 轮询」兑现(见 lib/subagent-carrier.md 第 1 步) —— 不能用一次前台
# Bash 调用直等,前台上限 600s,超时即掐断且孤儿进程输出会永久丢失(2026-08-14 codex 事故)。
# 优先级: per-agent timeout_sec  > [defaults].timeout_sec。
# 用 /xcheck-setup timeout [N|<agent> N] 查看/设置。
#
# 默认 agent 集: 设了之后 /xcheck 直接拿这组跑,跳过每次勾选。
# 字段 default_agents = ["claude", "codex", ...](名字须对得上下面 [agents.<name>] 的 key)。
# 字段缺失/空 = 未设默认 → /xcheck 报错停住,提示先设默认集(出厂默认)。
# 用 /xcheck-setup default [a,b,c | --clear] 查看/设置/清空。

[defaults]
# 所有 agent 的默认最大执行秒数。per-agent timeout_sec 覆盖此值。
timeout_sec = 2700
# 默认 agent 集(可选)。设了 /xcheck 就跳过每次勾选直接用这组。
# 出厂不设(注释掉);要用就取消注释、填名字。详见顶部说明。
default_agents = ["codex", "pi"]

[agents.claude]
installed_check = "claude"
run_cmd         = "claude -p"      # prompt passed as one quoted arg
input_mode      = "arg"
needs_timeout   = false
timeout_sec     = 2700

[agents.codex]
installed_check = "codex"
# --skip-git-repo-check: 2026-08-15 实测,工作目录不在 git 仓库内(或未加信任)时
# codex exec 直接拒绝: "Not inside a trusted directory and --skip-git-repo-check
# was not specified."(exit 1)。评审对象常在多个平级仓库甚至非仓库目录,xcheck
# 不应被 git 边界卡住,故常带此 flag。
run_cmd         = "codex exec --skip-git-repo-check -s danger-full-access -"   # reads prompt from stdin
# ^ 2026-09-06: codex-cli 0.153.0 在 Windows 非交互模式下, read-only/workspace-write 沙箱全部
#   "blocked by policy" 拒绝进程创建(连 pwd 都拦, 读文件必超时); 老版本无此层。须全权档才能
#   参评(冒烟+用户批准实证)。升级 CLI 后可尝试降回默认档重测。
input_mode      = "stdin"
needs_timeout   = false
timeout_sec     = 2700

[agents.opencode]
installed_check = "opencode"
run_cmd         = "opencode run"   # no --format json: default formatted text (Task 1 decision)
input_mode      = "arg"
needs_timeout   = true             # known to hang on input occasionally -> force timeout
timeout_sec     = 2700

[agents.pi]
installed_check = "pi"
# 2026-09-17 实验记录:曾尝试 per-run 直连 `pi -p --model bigmodel/glm-5.3` 绕开
# ccswitch 的 anthropic 兼容端点(该端点当天四次间歇 >60s 挂起),结果 401 —— pi 的
# bigmodel provider 未配密钥(密钥只在 cc-switch 里)。per-run 路线被鉴权挡死;
# 根治(pi auth 配 bigmodel 密钥 / 改 cc-switch 路由)属全局配置,走 E'' 备份纪律,
# 用户拍板后再做。当前靠 smoke_timeout_sec=120 + 冒烟自动重试吸收波动。
run_cmd         = "pi -p"          # non-interactive print mode; prompt passed as trailing message arg
input_mode      = "arg"
needs_timeout   = false
timeout_sec     = 2700
# 冒烟预算(第 2 步用,缺省 60):pi 这类多轮调用通道在上游降速窗口会整体变慢,
# 60s 假死(2026-09-17 实测 120s 内正常完成),放宽到 120 减少假阳性击杀。
smoke_timeout_sec = 120

[agents.kimi]
installed_check = "kimi"
run_cmd         = "kimi -p"         # non-interactive print mode; prompt passed as single arg (Kimi Code CLI)
input_mode      = "arg"
needs_timeout   = false
timeout_sec     = 2700
